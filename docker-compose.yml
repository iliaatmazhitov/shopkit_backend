version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopkit_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-shopkit}
      POSTGRES_USER: ${DATABASE_USER:-shopkit}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-shopkit_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-shopkit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - shopkit_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopkit_backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-shopkit}
      DATABASE_USER: ${DATABASE_USER:-shopkit}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-shopkit_pass}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./shopkit/logs:/app/logs
      - ./shopkit/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - shopkit_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  shopkit_network:
    driver: bridge
